services:
  - type: web
    name: factory-management-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: api
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: COCOA_ERP_DB
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
